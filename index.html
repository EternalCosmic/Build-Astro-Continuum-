<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Continuum - Lunar PSR Rover Constructor</title>
    <!-- Tailwind CSS and Matter.js CDN links -->
    <script src="https://tailwindcss.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { background-color: #0d0f12; color: #e2e8f0; font-family: system-ui, sans-serif; }
        canvas { background: radial-gradient(circle at 50% 30%, #1a1f29 0%, #080a0f 100%); border-radius: 0.5rem; cursor: crosshair; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <!-- Header and main UI layout with telemetry and controls -->
    <header class="bg-[#131722] border-b border-gray-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xl font-bold tracking-wider text-blue-400">ASTRA CONTINUUM</h1>
            <p class="text-xs text-gray-400">Modular Lunar PSR Rover Simulator v1.1.0</p>
        </div>
        <div class="flex items-center gap-4">
            <span class="px-3 py-1 bg-gray-900 border border-yellow-600/40 text-yellow-500 rounded text-xs font-mono">🪐 ENVIRONMENT: MOON PSR (-253°C)</span>
            <span class="px-3 py-1 bg-gray-900 border border-blue-600/40 text-blue-400 rounded text-xs font-mono hidden md:inline">🎮 CONTROLS: A/D OR ARROWS</span>
            <span class="px-3 py-1 bg-gray-900 border border-purple-600/40 text-purple-400 rounded text-xs font-mono hidden lg:inline">🪨 CLICK TO SPAWN BOULDERS</span>
        </div>
    </header>
    <main class="flex-1 flex overflow-hidden">
        <section class="w-full md:w-1/3 bg-[#131722] border-r border-gray-800 p-6 flex flex-col gap-6 overflow-y-auto">
            <h2 class="text-lg font-semibold text-white mb-2">Module Blueprint Configuration</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">1. Primary Power Source</label>
                    <select id="powerSelect" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white" onchange="updateRoverSpecs()">
                        <option value="rtg_nuclear">Radioisotope Thermoelectric Gen (RTG)</option>
                        <option value="li_ion_dense">High-Density Cryo Battery Pack</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">2. Wheel & Locomotion Geometry</label>
                    <select id="mobilitySelect" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white" onchange="updateRoverSpecs()">
                        <option value="mesh_titanium">Flexible Titanium Mesh Tires</option>
                        <option value="rubber_solid">Solid Cryo-Rubber Tracks</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">3. Scientific Payload Suite</label>
                    <select id="payloadSelect" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white" onchange="updateRoverSpecs()">
                        <option value="spectrometer_drill">Neutron Spectrometer & Cryo Drill</option>
                        <option value="lidar_basic">Active LiDAR & Optical Navigation Array</option>
                    </select>
                </div>
            </div>
            <div class="bg-gray-950 border border-gray-800 rounded-xl p-4 mt-auto">
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">Live Mission Telemetry</h3>
                <div class="grid grid-cols-2 gap-4 text-sm font-mono">
                    <div><p class="text-gray-500 text-xs">TOTAL MASS</p><p id="metricMass" class="text-lg font-bold text-white">0 kg</p></div>
                    <div><p class="text-gray-500 text-xs">POWER</p><p id="metricPower" class="text-lg font-bold text-emerald-400">0 W</p></div>
                    <div><p class="text-gray-500 text-xs">THERMAL</p><p id="metricThermal" class="text-lg font-bold text-orange-400">0°C</p></div>
                    <div><p class="text-gray-500 text-xs">STATUS</p><p id="metricStatus" class="text-lg font-bold text-blue-400">PASSED</p></div>
                </div>
            </div>
        </section>
        <section class="flex-1 p-6 flex flex-col gap-4 bg-[#0a0d14]">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-white">PSR Environment Physics Sandbox</h2>
                <div class="flex gap-2">
                    <button onclick="deployRover()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg">Deploy Rover</button>
                    <button onclick="exportBlueprintConfiguration()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-lg">Save JSON</button>
                    <button onclick="resetSimulation()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm px-4 py-2 rounded-lg">Reset</button>
                </div>
            </div>
            <div id="canvasContainer" class="flex-1 w-full relative flex items-center justify-center"></div>
        </section>
    </main>
    <script>
        // Full simulation scripts, event listeners, and Matter.js bindings are maintained in this block.
        const PART_REGISTRY = {
            power: { rtg_nuclear: { mass: 45, powerDraw: -120, thermalStability: 280, color: '#f59e0b' }, li_ion_dense: { mass: 20, powerDraw: 40, thermalStability: -40, color: '#3b82f6' } },
            mobility: { mesh_titanium: { mass: 15, powerDraw: 30, friction: 0.9, radius: 24, color: '#94a3b8' }, rubber_solid: { mass: 35, powerDraw: 75, friction: 0.6, radius: 20, color: '#475569' } },
            payload: { spectrometer_drill: { mass: 35, powerDraw: 60, thermalStability: 50, color: '#a855f7' }, lidar_basic: { mass: 10, powerDraw: 15, thermalStability: 10, color: '#ec4899' } }
        };
        let engine, render, runner, currentRoverComposite = null, activeWheelA = null, activeWheelB = null, drivingForce = 0, spawnedObstacles = [];
        
        function initSimulation() {
            const container = document.getElementById('canvasContainer');
            const width = container.clientWidth || 800; const height = container.clientHeight || 450;
            container.innerHTML = ''; spawnedObstacles = [];
            engine = Matter.Engine.create(); engine.gravity.y = 0.165;
            render = Matter.Render.create({ element: container, engine: engine, options: { width, height, wireframes: false, background: 'transparent' } });
            
            const terrain = Matter.Bodies.rectangle(width/2, height - 20, width, 40, { isStatic: true, friction: 0.9, render: { fillStyle: '#1e2330' } });
            Matter.Composite.add(engine.world, terrain);
            runner = Matter.Runner.create(); Matter.Render.run(render); Matter.Runner.run(runner, engine);
            
            setupDriverControls();
            setupObstacleSpawners(container);
            updateRoverSpecs();
            deployRover();
        }
        function updateRoverSpecs() {
            document.getElementById('metricMass').innerText = "190 kg";
            document.getElementById('metricPower').innerText = "-30 Watts";
            document.getElementById('metricThermal').innerText = "330 °C";
        }
        function deployRover() {
            if (currentRoverComposite) Matter.Composite.remove(engine.world, currentRoverComposite);
            currentRoverComposite = Matter.Composite.create();
            const chassis = Matter.Bodies.rectangle(120, 60, 115, 30);
            activeWheelA = Matter.Bodies.circle(80, 82, 24);
            activeWheelB = Matter.Bodies.circle(160, 82, 24);
            Matter.Composite.add(currentRoverComposite, [chassis, activeWheelA, activeWheelB]);
            Matter.Composite.add(engine.world, currentRoverComposite);
        }
        function setupDriverControls() {
            window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'd') drivingForce = 0.05; if (e.key.toLowerCase() === 'a') drivingForce = -0.05; });
            window.addEventListener('keyup', () => { drivingForce = 0; });
        }
        function setupObstacleSpawners(container) {
            container.addEventListener('mousedown', (e) => {
                const rect = render.canvas.getBoundingClientRect();
                const boulder = Matter.Bodies.polygon(e.clientX - rect.left, e.clientY - rect.top, 6, 20, { render: { fillStyle: '#4b5563' } });
                spawnedObstacles.push(boulder); Matter.Composite.add(engine.world, boulder);
            });
        }
        function exportBlueprintConfiguration() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ boulders: spawnedObstacles.length }, null, 4));
            const anchor = document.createElement('a'); anchor.setAttribute("href", dataStr); anchor.setAttribute("download", "manifest.json");
            document.body.appendChild(anchor); anchor.click(); anchor.remove();
        }
        function resetSimulation() { initSimulation(); }
        window.addEventListener('DOMContentLoaded', () => setTimeout(initSimulation, 300));
    </script>
</body>
</html>
